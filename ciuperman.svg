<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 1281" width="664" height="1281" role="img" aria-label="Ciuperman silueta neon">
  <style>
    @media (prefers-reduced-motion: reduce) {
      #figure { animation: none !important; }
    }
    #figure {
      transform-origin: 332px 1200px;
      animation: sway 5s ease-in-out infinite, glow 3.4s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-1.4deg) translateY(0); }
      50% { transform: rotate(1.6deg) translateY(-8px); }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 6px #39ff14); }
      50% { filter: drop-shadow(0 0 16px #39ff14); }
    }
  </style>
  <g id="figure">
    <image href="ciuperman-silhouette.png" width="664" height="1281" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
