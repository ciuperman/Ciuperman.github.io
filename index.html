<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ciuperman — registrul de povești din pădure. Carpați, ciuperci, filme scurte.">
  <title>Ciuperman — Registru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="banner" src="IMG_0328.png" alt="Ciuperman — Registrul de pădure" width="1600" height="520">
      <nav class="chips" aria-label="Secțiuni">
        <a href="#registru" class="chip is-on" data-i18n="navLedger">Registru</a>
        <a href="#despre" class="chip" data-i18n="navAbout">Dosar</a>
        <a href="#legaturi" class="chip" data-i18n="navLinks">Legături</a>
      </nav>
      <div class="lang" role="group" aria-label="Limbă">
        <button type="button" data-lang="ro" class="is-on">RO</button>
        <button type="button" data-en="en">EN</button>
      </div>
    </header>
    <img class="superman" src="ciuperman-silhouette.png" alt="Ciuperman — siluetă neon" width="647" height="1148">
    <p class="champignons" data-i18n="champignons">We are the Champignions, my friend!</p>
    <script src="scripts.js"></script>
</body>
</html>
