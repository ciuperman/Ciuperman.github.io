<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ciuperman — animație neon în canvas, scrisă în JavaScript.">
  <title>Ciuperman — Neon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #39ff14;
      --glow: rgba(57, 255, 20, 0.45);
      --ink: #9ad89a;
      --muted: #3f6b3f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: min(920px, 100%);
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    a {
      color: var(--moss);
      text-decoration: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    a:hover { text-shadow: 0 0 10px var(--glow); }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--moss);
      text-shadow: 0 0 12px var(--glow);
    }
    canvas {
      width: min(520px, 100vw);
      height: auto;
      aspect-ratio: 9 / 16;
      display: block;
      background: #000;
    }
    .hud {
      width: min(520px, 100%);
      padding: 10px 16px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    button {
      background: transparent;
      border: 1px solid #163316;
      color: var(--moss);
      border-radius: 999px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { box-shadow: 0 0 12px var(--glow); }
    .pose { color: var(--moss); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="./">← Registru</a>
      <h1>Ciuperman neon</h1>
      <span></span>
    </header>
    <canvas id="stage" width="720" height="1280" aria-label="Animație neon Ciuperman"></canvas>
    <div class="hud">
      <span id="poseLabel" class="pose">IDLE</span>
      <span id="clock">0.0s</span>
      <button type="button" id="toggle">Pauză</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const poseLabel = document.getElementById("poseLabel");
    const clockEl = document.getElementById("clock");
    const toggleBtn = document.getElementById("toggle");

    const GREEN = "#39ff14";
    const CORE = "#d8ffd0";
    const DURATION = 15.2;

    const poses = {
      idle: {
        name: "IDLE",
        hipX: 0, stance: 46, lean: 0.04,
        lHip: 0.18, lKnee: 0.12,
        rHip: -0.08, rKnee: 0.02,
        lShoulder: 1.22, lElbow: 1.05,
        rShoulder: -1.18, rElbow: 1.02,
        handL: "pocket", handR: "pocket",
        cape: 0.15, chest: 0, charge: 0, orbs: 0, burst: 0
      },
      idle2: {
        name: "IDLE",
        hipX: 2, stance: 48, lean: 0.05,
        lHip: 0.2, lKnee: 0.14,
        rHip: -0.06, rKnee: 0.02,
        lShoulder: 1.18, lElbow: 1.0,
        rShoulder: -1.15, rElbow: 1.0,
        handL: "pocket", handR: "pocket",
        cape: 0.22, chest: 0, charge: 0, orbs: 0, burst: 0
      },
      chest: {
        name: "CHARGE",
        hipX: 0, stance: 50, lean: 0,
        lHip: 0.08, lKnee: 0.08,
        rHip: -0.04, rKnee: 0.04,
        lShoulder: 0.55, lElbow: 1.35,
        rShoulder: -1.12, rElbow: 0.95,
        handL: "chest", handR: "pocket",
        cape: 0.28, chest: 0.4, charge: 0.35, orbs: 0, burst: 0
      },
      surge: {
        name: "SURGE",
        hipX: 0, stance: 58, lean: 0,
        lHip: 0.12, lKnee: 0.18,
        rHip: -0.12, rKnee: 0.18,
        lShoulder: 0.35, lElbow: 1.15,
        rShoulder: -0.85, rElbow: 0.7,
        handL: "fist", handR: "fist",
        cape: 0.5, chest: 1, charge: 1, orbs: 0.2, burst: 0.4
      },
      guard: {
        name: "GUARD",
        hipX: 0, stance: 78, lean: 0,
        lHip: 0.22, lKnee: 0.42,
        rHip: -0.22, rKnee: 0.42,
        lShoulder: -0.15, lElbow: 1.55,
        rShoulder: 0.15, rElbow: 1.55,
        handL: "fist", handR: "fist",
        cape: 0.7, chest: 0.8, charge: 0.7, orbs: 0.15, burst: 0.2
      },
      punch: {
        name: "PUNCH",
        hipX: -18, stance: 86, lean: -0.12,
        lHip: 0.35, lKnee: 0.5,
        rHip: -0.18, rKnee: 0.28,
        lShoulder: -1.55, lElbow: 0.12,
        rShoulder: 0.85, rElbow: 1.45,
        handL: "fist", handR: "fist",
        cape: 1.1, chest: 0.7, charge: 0.55, orbs: 0.1, burst: 0.6
      },
      kick: {
        name: "KICK",
        hipX: -8, stance: 40, lean: -0.35,
        lHip: 0.15, lKnee: 0.2,
        rHip: -1.55, rKnee: 0.08,
        lShoulder: -0.4, lElbow: 0.9,
        rShoulder: 0.95, rElbow: 0.2,
        handL: "fist", handR: "orb",
        cape: 1.3, chest: 0.85, charge: 0.8, orbs: 0.9, burst: 1
      },
      ready: {
        name: "READY",
        hipX: 0, stance: 74, lean: 0,
        lHip: 0.18, lKnee: 0.32,
        rHip: -0.18, rKnee: 0.32,
        lShoulder: 0.55, lElbow: 1.45,
        rShoulder: -0.55, rElbow: 1.45,
        handL: "fist", handR: "fist",
        cape: 0.55, chest: 0.75, charge: 0.55, orbs: 0.1, burst: 0.1
      },
      arms: {
        name: "ORBS",
        hipX: 0, stance: 70, lean: 0,
        lHip: 0.12, lKnee: 0.22,
        rHip: -0.12, rKnee: 0.22,
        lShoulder: -1.62, lElbow: 0.05,
        rShoulder: 1.62, rElbow: 0.05,
        handL: "orb", handR: "orb",
        cape: 0.8, chest: 1, charge: 1, orbs: 1, burst: 0.35
      },
      gather: {
        name: "GATHER",
        hipX: 0, stance: 68, lean: 0,
        lHip: 0.1, lKnee: 0.2,
        rHip: -0.1, rKnee: 0.2,
        lShoulder: 0.35, lElbow: 1.55,
        rShoulder: -0.35, rElbow: 1.55,
        handL: "orb", handR: "orb",
        cape: 0.9, chest: 1, charge: 1.2, orbs: 0.7, burst: 0.5
      },
      crossed: {
        name: "SEAL",
        hipX: 0, stance: 66, lean: 0,
        lHip: 0.08, lKnee: 0.16,
        rHip: -0.08, rKnee: 0.16,
        lShoulder: 0.72, lElbow: 1.62,
        rShoulder: -0.72, rElbow: 1.62,
        handL: "fist", handR: "fist",
        cape: 0.45, chest: 0.5, charge: 0.3, orbs: 0, burst: 0
      },
      hero: {
        name: "HERO",
        hipX: 0, stance: 64, lean: 0,
        lHip: 0.06, lKnee: 0.1,
        rHip: -0.06, rKnee: 0.1,
        lShoulder: 0.28, lElbow: 0.22,
        rShoulder: -0.28, rElbow: 0.22,
        handL: "open", handR: "open",
        cape: 0.35, chest: 0.55, charge: 0.4, orbs: 0, burst: 0
      }
    };

    const timeline = [
      [0.0, "idle"],
      [1.2, "idle2"],
      [2.4, "chest"],
      [4.1, "surge"],
      [5.4, "guard"],
      [6.6, "punch"],
      [7.8, "kick"],
      [9.0, "ready"],
      [10.2, "arms"],
      [11.5, "gather"],
      [12.7, "crossed"],
      [13.8, "hero"]
    ];

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function mixPose(a, b, t) {
      const out = { name: t > 0.55 ? b.name : a.name };
      for (const k of Object.keys(a)) {
        if (typeof a[k] === "number") out[k] = lerp(a[k], b[k], t);
        else out[k] = t > 0.5 ? b[k] : a[k];
      }
      return out;
    }

    function poseAt(time) {
      const t = ((time % DURATION) + DURATION) % DURATION;
      let i = 0;
      while (i < timeline.length - 1 && timeline[i + 1][0] <= t) i++;
      const [t0, n0] = timeline[i];
      const next = timeline[i + 1];
      if (!next) return { pose: poses[n0], t, name: poses[n0].name };
      const [t1, n1] = next;
      const span = Math.max(0.12, t1 - t0);
      const u = ease(clamp((t - t0) / span, 0, 1));
      return { pose: mixPose(poses[n0], poses[n1], u), t, name: u > 0.55 ? poses[n1].name : poses[n0].name };
    }

    const particles = [];
    function spawn(x, y, n, speed, life) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = speed * (0.3 + Math.random());
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 12,
          life: life * (0.5 + Math.random() * 0.7),
          max: life,
          r: 1.2 + Math.random() * 2.4
        });
      }
    }

    function drawGlowPath(build, width, alpha) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalAlpha = alpha * 0.28;
      ctx.strokeStyle = GREEN;
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 28;
      ctx.lineWidth = width * 3.1;
      build();
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.7;
      ctx.shadowBlur = 14;
      ctx.lineWidth = width * 1.7;
      build();
      ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 6;
      ctx.strokeStyle = CORE;
      ctx.lineWidth = width;
      build();
      ctx.stroke();
      ctx.restore();
    }

    function limb(from, ang, len) {
      return { x: from.x + Math.cos(ang) * len, y: from.y + Math.sin(ang) * len };
    }

    function drawCharacter(p, time) {
      const cx = canvas.width / 2 + p.hipX;
      const hipY = 690;
      const breath = Math.sin(time * 2.2) * 2;
      const hip = { x: cx, y: hipY + breath * 0.2 };
      const shoulder = { x: cx + p.lean * 40, y: 430 + breath };
      const neck = { x: shoulder.x, y: 392 };
      const head = { x: neck.x, y: 318 };

      const lHip = { x: hip.x - p.stance * 0.35, y: hip.y };
      const rHip = { x: hip.x + p.stance * 0.35, y: hip.y };
      const lKnee = limb(lHip, Math.PI / 2 + p.lHip, 118);
      const rKnee = limb(rHip, Math.PI / 2 + p.rHip, 118);
      const lFoot = limb(lKnee, Math.PI / 2 + p.lKnee, 122);
      const rFoot = limb(rKnee, Math.PI / 2 + p.rKnee, 122);

      const lSh = { x: shoulder.x - 58, y: shoulder.y + 8 };
      const rSh = { x: shoulder.x + 58, y: shoulder.y + 8 };
      const lElb = limb(lSh, Math.PI / 2 + p.lShoulder, 92);
      const rElb = limb(rSh, Math.PI / 2 + p.rShoulder, 92);
      const lHand2 = limb(lElb, Math.PI / 2 + p.lShoulder + (p.lElbow - 0.8), 90);
      const rHand2 = limb(rElb, Math.PI / 2 + p.rShoulder - (p.rElbow - 0.8), 90);

      const wind = Math.sin(time * 1.8) * 18 * (0.4 + p.cape);
      const capeTipL = { x: shoulder.x - 70 - wind - p.cape * 40, y: 820 + Math.cos(time * 1.5) * 10 };
      const capeTipR = { x: shoulder.x + 90 + wind * 0.6 + p.cape * 55, y: 780 + Math.sin(time * 1.7) * 12 };

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(lSh.x + 8, lSh.y - 6);
        ctx.quadraticCurveTo(shoulder.x - 120 - wind, 560, capeTipL.x, capeTipL.y);
        ctx.quadraticCurveTo(shoulder.x + 20, 900, capeTipR.x, capeTipR.y);
        ctx.quadraticCurveTo(shoulder.x + 130 + wind, 540, rSh.x - 8, rSh.y - 6);
      }, 3.2, 0.85);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(cx - 160, 980);
        ctx.lineTo(cx + 160, 980);
      }, 2.2, 0.55);
      drawGlowPath(() => {
        ctx.beginPath();
        ctx.ellipse(lFoot.x, 980, 28, 5, 0, 0, Math.PI * 2);
        ctx.moveTo(rFoot.x + 28, 980);
        ctx.ellipse(rFoot.x, 980, 28, 5, 0, 0, Math.PI * 2);
      }, 2, 0.45);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(lHip.x, lHip.y);
        ctx.lineTo(lKnee.x, lKnee.y);
        ctx.lineTo(lFoot.x, lFoot.y);
        ctx.moveTo(lFoot.x - 16, lFoot.y);
        ctx.lineTo(lFoot.x + 18, lFoot.y - 6);
      }, 4.2, 1);
      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(rHip.x, rHip.y);
        ctx.lineTo(rKnee.x, rKnee.y);
        ctx.lineTo(rFoot.x, rFoot.y);
        ctx.moveTo(rFoot.x - 16, rFoot.y);
        ctx.lineTo(rFoot.x + 18, rFoot.y - 6);
      }, 4.2, 1);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(lHip.x - 8, lHip.y - 8);
        ctx.lineTo(rHip.x + 8, rHip.y - 8);
        ctx.moveTo(lHip.x - 6, lHip.y + 8);
        ctx.lineTo(rHip.x + 6, rHip.y + 8);
        ctx.ellipse(hip.x, hip.y, 11, 9, 0, 0, Math.PI * 2);
      }, 3.4, 1);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(lHip.x - 4, lHip.y - 10);
        ctx.lineTo(lSh.x + 6, lSh.y + 10);
        ctx.moveTo(rHip.x + 4, rHip.y - 10);
        ctx.lineTo(rSh.x - 6, rSh.y + 10);
        ctx.moveTo(shoulder.x - 42, 500);
        ctx.lineTo(shoulder.x + 42, 500);
        ctx.moveTo(shoulder.x - 36, 545);
        ctx.lineTo(shoulder.x + 36, 545);
        ctx.moveTo(shoulder.x - 28, 590);
        ctx.lineTo(shoulder.x + 28, 590);
        ctx.moveTo(shoulder.x, 470);
        ctx.lineTo(shoulder.x, 640);
      }, 3.6, 1);

      const em = { x: shoulder.x, y: 478 };
      const pulse = 1 + p.charge * (0.18 + Math.sin(time * 8) * 0.08);
      drawGlowPath(() => {
        ctx.beginPath();
        ctx.arc(em.x, em.y, 22 * pulse, 0, Math.PI * 2);
        ctx.moveTo(em.x, em.y + 8 * pulse);
        ctx.lineTo(em.x, em.y + 26 * pulse);
        ctx.moveTo(em.x - 14 * pulse, em.y + 2);
        ctx.quadraticCurveTo(em.x, em.y - 18 * pulse, em.x + 14 * pulse, em.y + 2);
      }, 3.8, 1);

      if (p.charge > 0.2) {
        ctx.save();
        ctx.globalAlpha = 0.18 * p.charge;
        ctx.fillStyle = GREEN;
        ctx.shadowColor = GREEN;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(em.x, em.y, 34 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(lSh.x, lSh.y);
        ctx.lineTo(lElb.x, lElb.y);
        ctx.lineTo(lHand2.x, lHand2.y);
      }, 4, 1);
      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(rSh.x, rSh.y);
        ctx.lineTo(rElb.x, rElb.y);
        ctx.lineTo(rHand2.x, rHand2.y);
      }, 4, 1);

      function hand(pt, kind, side) {
        if (kind === "fist") {
          drawGlowPath(() => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 11, 0, Math.PI * 2);
          }, 3, 1);
        } else if (kind === "open") {
          drawGlowPath(() => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
            ctx.moveTo(pt.x, pt.y - 4);
            ctx.lineTo(pt.x + side * 10, pt.y - 18);
          }, 2.8, 1);
        } else if (kind === "chest") {
          drawGlowPath(() => {
            ctx.beginPath();
            ctx.ellipse(em.x - 18, em.y + 8, 12, 8, -0.4, 0, Math.PI * 2);
          }, 3, 1);
        } else if (kind === "orb") {
          drawGlowPath(() => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 16 + Math.sin(time * 10) * 2, 0, Math.PI * 2);
          }, 3.4, 1);
          ctx.save();
          ctx.globalAlpha = 0.35 * p.orbs;
          ctx.fillStyle = GREEN;
          ctx.shadowColor = GREEN;
          ctx.shadowBlur = 24;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          drawGlowPath(() => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          }, 2.6, 0.8);
        }
      }
      hand(lHand2, p.handL, -1);
      hand(rHand2, p.handR, 1);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(head.x - 46, head.y + 28);
        ctx.quadraticCurveTo(head.x - 58, head.y - 18, head.x, head.y - 58);
        ctx.quadraticCurveTo(head.x + 58, head.y - 18, head.x + 46, head.y + 28);
        ctx.quadraticCurveTo(head.x, head.y + 46, head.x - 46, head.y + 28);
      }, 4, 1);
      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(head.x - 38, neck.y + 8);
        ctx.quadraticCurveTo(head.x, neck.y + 28, head.x + 38, neck.y + 8);
        ctx.moveTo(lSh.x + 4, lSh.y - 2);
        ctx.quadraticCurveTo(neck.x, neck.y - 18, rSh.x - 4, rSh.y - 2);
      }, 3.4, 1);

      const eyeGlow = 0.7 + p.charge * 0.3 + Math.sin(time * 6) * 0.08;
      ctx.save();
      ctx.fillStyle = CORE;
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 16;
      ctx.globalAlpha = eyeGlow;
      ctx.beginPath();
      ctx.ellipse(head.x - 12, head.y - 4, 7, 4, -0.15, 0, Math.PI * 2);
      ctx.ellipse(head.x + 12, head.y - 4, 7, 4, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.moveTo(head.x - 10, head.y + 14);
        ctx.quadraticCurveTo(head.x, head.y + 20, head.x + 10, head.y + 14);
      }, 2.2, 0.8);

      drawGlowPath(() => {
        ctx.beginPath();
        ctx.arc(neck.x, neck.y + 6, 8, 0, Math.PI * 2);
      }, 2.8, 1);

      if (p.burst > 0.35 && Math.random() < p.burst * 0.4) {
        spawn(rHand2.x, rHand2.y, 4, 90, 0.7);
        if (p.handL === "orb") spawn(lHand2.x, lHand2.y, 3, 80, 0.6);
      }
      if (p.charge > 0.6 && Math.random() < 0.25) spawn(em.x, em.y, 2, 40, 0.9);

      return { lHand: lHand2, rHand: rHand2, em };
    }

    function drawSwirls(time, intensity) {
      if (intensity < 0.15) return;
      ctx.save();
      ctx.strokeStyle = GREEN;
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 12;
      ctx.globalAlpha = 0.35 * intensity;
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const y = 360 + (i * 70) + Math.sin(time * 1.4 + i) * 20;
        const x = canvas.width / 2 + side * (210 + Math.sin(time * 2 + i) * 20);
        ctx.beginPath();
        ctx.arc(x, y, 28 + i * 4, time * 2 + i, time * 2 + i + 4.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    let start = performance.now();
    let paused = false;
    let pauseAt = 0;

    toggleBtn.addEventListener("click", () => {
      paused = !paused;
      if (paused) pauseAt = (performance.now() - start) / 1000;
      else start = performance.now() - pauseAt * 1000;
      toggleBtn.textContent = paused ? "Play" : "Pauză";
    });

    function frame(now) {
      const time = paused ? pauseAt : (now - start) / 1000;
      const { pose, t, name } = poseAt(time);
      poseLabel.textContent = name;
      clockEl.textContent = t.toFixed(1) + "s / 15s";

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawSwirls(time, pose.charge);
      const anchors = drawCharacter(pose, time);

      for (let i = particles.length - 1; i >= 0; i--) {
        const q = particles[i];
        q.x += q.vx * 0.016;
        q.y += q.vy * 0.016;
        q.vy += 18 * 0.016;
        q.life -= 0.016;
        if (q.life <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = q.life / q.max;
        ctx.fillStyle = CORE;
        ctx.shadowColor = GREEN;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (pose.orbs > 0.4) {
        spawn(anchors.rHand.x, anchors.rHand.y, 1, 30, 0.5);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
