  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --moss:#39ff14; --glow:rgba(57,255,20,.5); --ink:#9ad89a; --muted:#3f6b3f; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#000; color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; }
    .wrap { min-height:100dvh; display:flex; flex-direction:column; align-items:center; }
    header { width:min(920px,100%); padding:14px 16px 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    a { color:var(--moss); text-decoration:none; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    a:hover { text-shadow:0 0 10px var(--glow); }
    h1 { margin:0; font-size:14px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--moss); text-shadow:0 0 12px var(--glow); }
    .stage { position:relative; width:min(420px,100vw); aspect-ratio:5/8; background:#000; overflow:hidden; }
    .stage svg, .stage canvas { position:absolute; inset:0; width:100%; height:100%; }
    .stage canvas { pointer-events:none; }
    .pose { opacity:0; transition:opacity .45s ease; filter:drop-shadow(0 0 6px rgba(57,255,20,.45)) drop-shadow(0 0 18px rgba(57,255,20,.25)); }
    .pose.is-on { opacity:1; }
    .line { fill:none; stroke:#39ff14; stroke-width:2.15; stroke-linecap:round; stroke-linejoin:round; }
    .fill { fill:#000; stroke:#39ff14; stroke-width:2.15; stroke-linecap:round; stroke-linejoin:round; }
    .soft { stroke-width:1.6; }
    .eye { fill:#eaffea; stroke:none; }
    .core { fill:#39ff14; stroke:none; opacity:.85; }
    .pulse { transform-origin:200px 268px; animation:pulse 1.6s ease-in-out infinite; }
    .cape-idle { transform-origin:200px 210px; animation:cape 3.4s ease-in-out infinite; }
    .charge .pulse { animation-duration:.7s; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.08);opacity:1} }
    @keyframes cape { 0%,100%{transform:rotate(0)} 50%{transform:rotate(1.4deg) translateX(2px)} }
    .hud { width:min(420px,100%); padding:10px 16px 22px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; color:var(--muted); font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.06em; }
    button { background:transparent; border:1px solid #163316; color:var(--moss); border-radius:999px; padding:7px 12px; font-family:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
    button:hover { box-shadow:0 0 12px var(--glow); }
    .pose-name { color:var(--moss); }
  </style>
</head>

  <script>
    const order = [
      { id: "p-idle", name: "IDLE", t: 0.0, particles: 0 },
      { id: "p-charge", name: "CHARGE", t: 3.1, particles: 0.4 },
      { id: "p-guard", name: "GUARD", t: 6.0, particles: 0.55 },
      { id: "p-kick", name: "KICK", t: 8.6, particles: 1 },
      { id: "p-hero", name: "ORBS", t: 11.4, particles: 0.8 }
    ];
    const DURATION = 15;
    const poses = order.map((p) => document.getElementById(p.id));
    const label = document.getElementById("poseLabel");
    const clock = document.getElementById("clock");
    const toggle = document.getElementById("toggle");
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    function resize() {
      const r = stage.getBoundingClientRect();
      canvas.width = Math.round(r.width * devicePixelRatio);
      canvas.height = Math.round(r.height * devicePixelRatio);
    }
    resize();
    window.addEventListener("resize", resize);
    const bits = [];
    function burst(x, y, n, speed) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = speed * (0.25 + Math.random());
        bits.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5+Math.random()*0.7, max: 1.2, r: 0.8+Math.random()*2 });
      }
    }
    function show(nameId) {
      poses.forEach((el) => el.classList.toggle("is-on", el.id === nameId));
      stage.classList.toggle("charge", nameId !== "p-idle");
    }
    function at(t) {
      const x = ((t % DURATION) + DURATION) % DURATION;
      let cur = order[0];
      for (const step of order) if (x >= step.t) cur = step;
      return { cur, x };
    }
    let start = performance.now();
    let paused = false;
    let hold = 0;
    let lastName = "";
    toggle.addEventListener("click", () => {
      paused = !paused;
      if (paused) hold = (performance.now() - start) / 1000;
      else start = performance.now() - hold * 1000;
      toggle.textContent = paused ? "Play" : "Pauză";
    });
    function frame(now) {
      const t = paused ? hold : (now - start) / 1000;
      const { cur, x } = at(t);
      if (cur.name !== lastName) {
        show(cur.id);
        lastName = cur.name;
        const w = canvas.width, h = canvas.height;
        if (cur.name === "CHARGE") burst(w*0.5, h*0.42, 18, 80);
        if (cur.name === "KICK") burst(w*0.82, h*0.24, 28, 120);
        if (cur.name === "ORBS") { burst(w*0.08, h*0.36, 16, 90); burst(w*0.92, h*0.34, 16, 90); }
      }
      label.textContent = cur.name;
      clock.textContent = x.toFixed(1) + "s / 15s";
      if (cur.particles > 0 && Math.random() < cur.particles * 0.12) {
        burst(canvas.width*(0.35+Math.random()*0.3), canvas.height*(0.35+Math.random()*0.15), 2, 40);
      }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for (let i = bits.length-1; i >= 0; i--) {
        const q = bits[i];
        q.x += q.vx*0.016; q.y += q.vy*0.016; q.vy += 8*0.016; q.life -= 0.016;
        if (q.life <= 0) { bits.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, q.life/q.max);
        ctx.fillStyle = "#d8ffd0";
        ctx.shadowColor = "#39ff14";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.r*devicePixelRatio, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
